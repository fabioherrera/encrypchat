name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core
        run: cargo test -p encrypchat_core
      - name: Test relay
        run: cargo test -p encrypchat_relay
      - name: Build relay
        run: cargo build -p encrypchat_relay

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      # Dart FFI loads the core at runtime, so the tests need a real .so.
      - name: Build FFI
        run: |
          cargo build -p encrypchat_core --release
          mkdir -p apps/client/native
          cp -f target/release/libencrypchat_core.so apps/client/native/
      - name: Flutter test
        working-directory: apps/client
        env:
          ENCRYPCHAT_CORE_LIB: ${{ github.workspace }}/apps/client/native/libencrypchat_core.so
        run: |
          flutter pub get
          flutter test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Packaging (Linux tarball / Android APK) stays manual — see docs/phase-8.md.
