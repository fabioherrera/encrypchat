# Windows binaries, built where they can be built.
#
# The Flutter Windows runner is an MSVC project: it cannot be cross-compiled from Linux, and
# the machine this project is developed on is Fedora. That left Windows as a permanent hole
# in `make package` — one of the four platforms the product claims parity on, with no way to
# even see it fail. A hosted Windows runner closes it without anyone buying a second machine.
#
# Manual by default: nobody needs a Windows build on every commit. Tags build
# automatically, because that is when the artifact is worth keeping. A PR that
# touches this workflow or the NSIS packaging also builds — that is how a Linux
# host starts a Windows compile without actions:write on workflow_dispatch.
name: windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "packaging/windows/**"
      - "scripts/package-windows.ps1"
      - "scripts/package-windows.sh"
      - "scripts/package-windows-installer.sh"

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      # Same remap as the Makefile: panic messages carry the path of the source file that
      # raised them, and there is no reason to ship a runner's directory layout.
      - name: Build the core
        shell: bash
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/encrypchat
        run: |
          set -euo pipefail
          cargo build -p encrypchat_core --release --target x86_64-pc-windows-msvc
          mkdir -p apps/client/native
          cp -f target/x86_64-pc-windows-msvc/release/encrypchat_core.dll apps/client/native/

      - name: Build the client
        shell: bash
        working-directory: apps/client
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --tree-shake-icons

      # The failure this build is most likely to have is an .exe that starts and then shows
      # the core-missing banner, which looks like a broken app rather than a packaging slip.
      # Cheaper to catch here than on someone's desktop.
      - name: The core travels with the app
        shell: bash
        working-directory: apps/client/build/windows/x64/runner/Release
        run: |
          set -euo pipefail
          test -f encrypchat.exe
          test -f encrypchat_core.dll
          test -d data

      - name: Package
        id: package
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' apps/client/pubspec.yaml | head -1)"
          name="encrypchat-windows-x64-${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            name="${name}-pr${PR_NUMBER}"
          fi
          mkdir -p dist
          cd apps/client/build/windows/x64/runner/Release
          # PDBs carry the builder path and are not needed to run.
          7z a -tzip "../../../../../../../dist/${name}.zip" ./* "-xr!*.pdb"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # NSIS is the analog of the Fedora RPM: Start Menu, Add/Remove Programs, an
      # uninstaller that takes the program back out and leaves chats alone. The
      # same .nsi compiles on this runner and on a Linux host that only has the zip.
      - name: NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          choco install nsis -y --no-progress
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:${PATH}"
          scripts/package-windows-installer.sh apps/client/build/windows/x64/runner/Release

      # Not a release: unsigned, and Windows will say so loudly when it runs. Retained for a
      # month, which is the window in which someone is actually testing it.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 30
          if-no-files-found: error
