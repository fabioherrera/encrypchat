[workspace]
resolver = "2"
members = [
    "crates/core",
    "services/relay",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"

[profile.release]
# Exported FFI symbols live in .dynsym and survive stripping; only the debug
# symbol table is dropped (~30% off libencrypchat_core.so).
strip = "symbols"
