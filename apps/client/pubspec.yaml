name: encrypchat
description: Encrypchat — decentralized P2P chat (Flutter client)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  ffi: ^2.1.4
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  # Direct deps only to force the Android Photo Picker (see core/media_picker.dart).
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  http: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  # One SQLite implementation on all four platforms (see hooks below): the
  # sqflite native plugin would use the OS SQLite on Android/iOS, which cannot
  # read an encrypted file.
  sqflite_common_ffi: ^2.4.2
  flutter_webrtc: ^1.6.0
  url_launcher: ^6.3.1
  mobile_scanner: ^7.4.0
  zxing2: ^0.2.4
  image: ^4.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Ship SQLCipher instead of plain SQLite, so the database file itself is
# encrypted (LocalDatabase sets `PRAGMA key`). Prebuilt for Android, iOS,
# Linux and Windows; replaces the bundled libsqlite3, never adds a second copy.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-mark.png
    - assets/brand/app-icon.png
