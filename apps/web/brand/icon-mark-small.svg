<!--
  Encrypchat mark, reduced for 16 and 32 px.

  The full mark (public/logo-mark.png) carries three concentric rings, two
  speech bubbles and a padlock. Below ~48 px those collapse into a smudge, so
  the favicon keeps only what survives: the shield silhouette and the lock.
  Same navy, same meaning, one shape per element.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <path
    d="M32 3 L59 12 V31 C59 45.5 47.5 56.5 32 61 C16.5 56.5 5 45.5 5 31 V12 Z"
    fill="#0F2744" />
  <path
    d="M24 30 V25 a8 8 0 0 1 16 0 V30"
    fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <rect x="20" y="29" width="24" height="20" rx="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="37.5" r="3.2" fill="#0F2744" />
  <rect x="30.6" y="37.5" width="2.8" height="6" rx="1.4" fill="#0F2744" />
</svg>
