server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applies to text/plain too, which is what `/.well-known/security.txt` is served as:
    # RFC 9116 wants it UTF-8, and nginx sends no charset unless told.
    charset utf-8;

    # TLS ends at Cloudflare, so `$scheme` here is http. Let nginx answer with a
    # relative `Location` or every redirect below would send browsers to http://
    # and cost them an extra hop back up to https.
    absolute_redirect off;

    # `trailingSlash: false` in next.config, so /es/privacy is the canonical URL and
    # /es/privacy/ is not a second one. Point the slashed form at it instead of
    # answering both: /es/ used to hit the exported directory and get a bare 403,
    # and /es/privacy/ fell through to the root page, which bounces to /en and
    # loses the language the visitor was reading in.
    rewrite ^/(.+)/$ /$1 permanent;

    # Next static export uses .html files; pretty URLs without trailing slash
    location / {
        # No Cache-Control at all left HTML to heuristic caching, which can hold a
        # page for hours after a deploy. Revalidating costs one conditional request
        # and usually gets a 304.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # `/index.html` used to be the fallback, so a URL that does not exist answered
    # 200 with the root redirect: a soft 404 that search engines index and that
    # sends the visitor to /en instead of telling them the page is gone.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Exact matches win over the regex below, so these two stay indexable and
    # cacheable as they were.
    location = /robots.txt { try_files $uri =404; }
    location = /.well-known/security.txt { try_files $uri =404; }

    # Next publishes each route's RSC payload as a sibling .txt — the whole page
    # copy in plain text, with no way to carry a canonical or a meta robots. Serve
    # it (the app router fetches it on client navigation), but keep it out of the
    # index: otherwise it competes with the page it duplicates.
    location ~* \.txt$ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # The update catalogue the installed app polls. It is data, not a page, so it
    # does not belong in a search index. The short max-age is the point: cache it
    # hard and a published release stays invisible to clients that already asked.
    location = /latest.json {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Next fingerprints everything under this path, so the URL changes whenever
    # the bytes do and freezing it is safe. `^~` stops the regex below from
    # claiming these first.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The rest keeps stable names — favicon.ico, og.png, logo-mark.png — so
    # `immutable` was a lie: it tells caches never to revalidate, and Cloudflare
    # went on serving the favicon that shipped before the shield existed. An
    # hour of freshness plus revalidation replaces a week of being stuck.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
