server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applies to text/plain too, which is what `/.well-known/security.txt` is served as:
    # RFC 9116 wants it UTF-8, and nginx sends no charset unless told.
    charset utf-8;

    # Next static export uses .html files; pretty URLs without trailing slash
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Exact matches win over the regex below, so these two stay indexable and
    # cacheable as they were.
    location = /robots.txt { try_files $uri =404; }
    location = /.well-known/security.txt { try_files $uri =404; }

    # Next publishes each route's RSC payload as a sibling .txt — the whole page
    # copy in plain text, with no way to carry a canonical or a meta robots. Serve
    # it (the app router fetches it on client navigation), but keep it out of the
    # index: otherwise it competes with the page it duplicates.
    location ~* \.txt$ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # The update catalogue the installed app polls. It is data, not a page, so it
    # does not belong in a search index. The short max-age is the point: cache it
    # hard and a published release stays invisible to clients that already asked.
    location = /latest.json {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
