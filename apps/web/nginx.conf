server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applies to text/plain too, which is what `/.well-known/security.txt` is served as:
    # RFC 9116 wants it UTF-8, and nginx sends no charset unless told.
    charset utf-8;

    # Next static export uses .html files; pretty URLs without trailing slash
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
