[package]
name = "encrypchat_core"
version = "0.3.0"
edition = "2021"
description = "Encrypchat local identity and E2EE core"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
chacha20poly1305 = "0.10"
hex = "0.4"
libc = "0.2"
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
