[package]
name = "encrypchat_core"
version = "0.8.1"
edition = "2021"
description = "Encrypchat local identity, E2EE, at-rest AEAD, and P2P networking core"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
chacha20poly1305 = "0.10"
hex = "0.4"
libc = "0.2"
multiaddr = "0.18"
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "rt"] }
