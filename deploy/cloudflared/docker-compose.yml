# Cloudflare Tunnel (cloudflared) for Encrypchat / Dokploy
#
# Joins external network `dokploy-network` so it can resolve `dokploy-traefik`.
# Public hostnames (encrypchat.com → http://dokploy-traefik:80) are configured
# in Cloudflare Zero Trust; this compose only runs the connector.
#
# Dokploy:
#   Type: Docker Compose
#   Compose path: deploy/cloudflared/docker-compose.yml
#   Env: TUNNEL_TOKEN=<token from Cloudflare Zero Trust>
#
# Or on the host:
#   cd deploy/cloudflared
#   export TUNNEL_TOKEN=...
#   docker compose up -d
#
# IF THE BLIND RELAY IS BEHIND THIS TUNNEL, IT NEEDS CONFIGURING (F-13)
#
# Every request then reaches encrypchat_relay from Traefik, not from the user, so its per-IP
# rate limit charges all users to one bucket and one client can lock everyone out with `429`.
# On the relay service, set the addresses it should believe `X-Forwarded-For` from:
#
#   ENCRYPCHAT_RELAY_TRUSTED_PROXIES=127.0.0.1,::1,172.18.0.0/16   # adjust to your network
#
# and rate-limit at Traefik as well — the relay's limiter is per process and never sees what
# the proxy already accepted. Details: services/relay/README.md → "Behind a reverse proxy".
# The relay logs a warning if all its traffic arrives from a single address with no proxy
# configured, which is what this misconfiguration looks like from the inside.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: encrypchat-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Dokploy often uses CLOUDFLARE_TUNNEL_TOKEN; cloudflared expects TUNNEL_TOKEN
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-${TUNNEL_TOKEN}}
    networks:
      - dokploy-network
    # Optional: only if you must reach host ports instead of Traefik DNS
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

networks:
  dokploy-network:
    external: true
    name: dokploy-network
